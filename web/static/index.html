<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Bear and Moose Monero mining pool">
    <title>Bear and Moose XMR</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            background: #101418;
            color: #f7f7f5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at top, rgb(255 102 0 / 18%), transparent 42rem),
                #101418;
        }

        main {
            width: min(42rem, calc(100% - 2rem));
            padding: clamp(2rem, 8vw, 5rem);
            border: 1px solid rgb(255 255 255 / 12%);
            border-radius: 1.5rem;
            background: rgb(24 29 34 / 88%);
            box-shadow: 0 2rem 6rem rgb(0 0 0 / 35%);
            text-align: center;
        }

        .mark {
            display: inline-grid;
            width: 4.5rem;
            height: 4.5rem;
            place-items: center;
            margin-bottom: 1.25rem;
            border-radius: 50%;
            background: #ff6600;
            color: white;
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.08em;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.2rem, 8vw, 4rem);
            line-height: 1;
            letter-spacing: -0.05em;
        }

        p {
            max-width: 29rem;
            margin: 1.5rem auto 0;
            color: #b8c0c7;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            margin-top: 2rem;
            padding: 0.55rem 0.9rem;
            border: 1px solid rgb(255 255 255 / 12%);
            border-radius: 999px;
            color: #dce2e6;
            font-size: 0.85rem;
        }

        .status::before {
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            background: #59d185;
            content: "";
            box-shadow: 0 0 0 0.2rem rgb(89 209 133 / 12%);
        }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">XMR</div>
        <h1>Bear &amp; Moose</h1>
        <p>
            A new Monero mining pool is taking shape. Private by design,
            built for independent miners, and powered by P2Pool.
        </p>
        <div class="status">Coming soon</div>
    </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block description %}Bear and Moose Monero mining pool{% endblock %}">
    <title>{% block title %}Bear and Moose XMR{% endblock %}</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            background: #101418;
            color: #f7f7f5;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1rem;
            background: radial-gradient(circle at top, rgb(255 102 0 / 18%), transparent 42rem), #101418;
        }

        main {
            width: min(28rem, 100%);
            padding: clamp(1.75rem, 7vw, 3rem);
            border: 1px solid rgb(255 255 255 / 12%);
            border-radius: 1.5rem;
            background: rgb(24 29 34 / 92%);
            box-shadow: 0 2rem 6rem rgb(0 0 0 / 35%);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            color: #f7f7f5;
            font-weight: 800;
            text-decoration: none;
        }

        .brand img {
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
        }

        h1 { margin: 0; text-align: center; font-size: 2rem; }
        .lead { margin: 0.75rem 0 1.75rem; color: #b8c0c7; text-align: center; line-height: 1.5; }
        label { display: block; margin-top: 1rem; color: #dce2e6; font-size: 0.9rem; font-weight: 700; }
        input {
            width: 100%;
            margin-top: 0.45rem;
            padding: 0.8rem 0.9rem;
            border: 1px solid rgb(255 255 255 / 18%);
            border-radius: 0.7rem;
            background: #101418;
            color: #f7f7f5;
            font: inherit;
        }
        input:focus { border-color: #ff6600; outline: 2px solid rgb(255 102 0 / 20%); }
        button {
            width: 100%;
            margin-top: 1.5rem;
            padding: 0.8rem;
            border: 0;
            border-radius: 999px;
            background: #ff6600;
            color: #17110d;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }
        .alternate { margin: 1.5rem 0 0; color: #b8c0c7; text-align: center; }
        .alternate a { color: #ff8b3d; }
    </style>
</head>
<body>
    <main>
        <a class="brand" href="/">
            <img src="/img/logo.png" alt="">
            <span>Bear &amp; Moose XMR</span>
        </a>
        {% block content %}{% endblock %}
    </main>
</body>
</html>

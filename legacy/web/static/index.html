<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Bear and Moose Monero mining pool">
    <title>Bear and Moose XMR</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            background: #101418;
            color: #f7f7f5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at top, rgb(255 102 0 / 18%), transparent 42rem),
                #101418;
        }

        main {
            width: min(42rem, calc(100% - 2rem));
            padding: clamp(2rem, 8vw, 5rem);
            border: 1px solid rgb(255 255 255 / 12%);
            border-radius: 1.5rem;
            background: rgb(24 29 34 / 88%);
            box-shadow: 0 2rem 6rem rgb(0 0 0 / 35%);
            text-align: center;
        }

        .logo {
            display: block;
            width: min(15rem, 72vw);
            height: auto;
            margin-inline: auto;
            margin-bottom: 1.25rem;
            border-radius: 50%;
            filter: drop-shadow(0 1rem 2.5rem rgb(255 102 0 / 18%));
        }

        h1 {
            margin: 0;
            font-size: clamp(2.2rem, 8vw, 4rem);
            line-height: 1;
            letter-spacing: -0.05em;
        }

        p {
            max-width: 29rem;
            margin: 1.5rem auto 0;
            color: #b8c0c7;
            font-size: 1.05rem;
            line-height: 1.7;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 2rem;
        }

        .button {
            min-width: 8.5rem;
            padding: 0.75rem 1.1rem;
            border: 1px solid rgb(255 255 255 / 12%);
            border-radius: 999px;
            color: #dce2e6;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            transition: border-color 150ms ease, transform 150ms ease;
        }

        .button.primary {
            border-color: #ff6600;
            background: #ff6600;
            color: #17110d;
        }

        .button:hover,
        .button:focus-visible {
            border-color: #ff8b3d;
            outline: none;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <main>
        <img class="logo" src="/img/logo.png" alt="Bear and Moose XMR logo">
        <h1>Bear &amp; Moose</h1>
        <p>
            A new Monero mining pool is taking shape. Private by design,
            built for independent miners, and powered by P2Pool.
        </p>
        <nav aria-label="Account navigation">
            <a class="button" href="/login">Log in</a>
            <a class="button primary" href="/signup">Sign up</a>
        </nav>
    </main>
</body>
</html>

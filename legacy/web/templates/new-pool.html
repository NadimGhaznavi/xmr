{% extends "base.html" %}
{% block title %}New pool · Bear and Moose XMR{% endblock %}
{% block content %}
    <h1>New Pool</h1>
    <p class="lead">Choose the P2Pool chain for this pool.</p>
    {% if form_error %}<p class="form-error" role="alert">{{ form_error }}</p>{% endif %}
    <form method="post" action="/api">
        <input type="hidden" name="MODULE" value="AppMgr">
        <input type="hidden" name="METHOD" value="create_pool">
        <label for="chain">Chain</label>
        <select id="chain" name="chain" required>
            <option value="">Choose a chain</option>
            {% for option in available_chains %}
                <option value="{{ option }}"{% if chain == option %} selected{% endif %}>{{ option|capitalize }}</option>
            {% endfor %}
        </select>
        <button type="submit">Create pool</button>
    </form>
    <p class="alternate"><a href="/dashboard">Return to dashboard</a></p>
{% endblock %}
